<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statement of Account — TamanGuard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .payref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
  :root { --ink: #111; --muted: #6b7280; --line: #d1d5db; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #e5e7eb; color: #111;
    font-family: Helvetica, Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page {
    width: 794px; min-height: 1123px; background: #fff; padding: 40px 44px 236px;
    margin: 24px auto; position: relative; box-shadow: 0 6px 22px rgba(0,0,0,.18);
  }
  header { display: flex; justify-content: space-between; align-items: flex-start;
           border-bottom: 2.5px solid var(--ink); padding-bottom: 10px; }
  .brand h1 { font-size: 15px; letter-spacing: .02em; margin: 0 0 3px; font-weight: 800; }
  .brand p { margin: 1px 0; font-size: 10px; color: #374151; }
  .brand .small { font-size: 9px; color: var(--muted); }
  .doc { text-align: right; }
  .doc h2 { font-size: 13px; letter-spacing: .14em; margin: 0 0 6px; font-weight: 800; }
  table.meta { font-size: 9.5px; margin-left: auto; border-collapse: collapse; }
  table.meta td { padding: 1px 0 1px 10px; }
  table.meta td:first-child { color: var(--muted); text-align: right; }
  .mono { font-family: "Courier New", monospace; font-size: 9.5px; }

  section.house { display: flex; gap: 18px; margin-top: 14px; }
  table.kv { font-size: 10.5px; border-collapse: collapse; flex: 1; }
  table.kv td { padding: 2.5px 0; vertical-align: top; }
  table.kv td.k { color: var(--muted); width: 96px; }

  .summary { width: 288px; border: 1px solid var(--ink); padding: 8px 10px; }
  .summary .sub { opacity: .7; font-size: 10px; }
  .summary .srow { display: flex; justify-content: space-between; font-size: 10.5px; padding: 2.5px 0; }
  .summary .srow b { font-family: "Courier New", monospace; font-size: 11px; }
  .summary .total { border-top: 1.5px solid var(--ink); margin-top: 4px; padding-top: 6px; font-weight: 800; }
  .summary .total b { font-size: 13px; }
  .summary .note { font-size: 9px; color: var(--muted); border-top: 1px dotted #999; margin-top: 4px; padding-top: 4px; }

  table.ledger { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 10px; table-layout: fixed; }
  col.c-date { width: 78px; } col.c-desc { width: auto; } col.c-amt { width: 96px; }
  table.ledger thead th { background: var(--ink); color: #fff; font-size: 8.5px; letter-spacing: .08em;
    text-transform: uppercase; padding: 6px; text-align: left; font-weight: 700; }
  table.ledger thead th span { font-size: 7px; letter-spacing: .04em; opacity: .75; }
  table.ledger th.num, table.ledger td.num { text-align: right; }
  table.ledger td { padding: 4px 6px; border-bottom: 1px solid #e5e7eb; }
  table.ledger td.date { font-family: "Courier New", monospace; font-size: 9px; color: #374151; white-space: nowrap; }
  table.ledger td.num { font-family: "Courier New", monospace; }
  table.ledger td.pay { color: #047857; font-weight: 700; }
  table.ledger td.bal { font-weight: 700; }
  table.ledger tr.opening td { background: #f9fafb; color: #374151; }
  table.ledger tr.section td { background: #eef2ff; font-size: 8.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .1em; color: #3730a3; padding: 5px 6px; }
  table.ledger tfoot td { border-top: 2px solid var(--ink); padding: 8px 6px; font-weight: 800; font-size: 11px; }
  table.ledger tfoot td.num { font-family: "Courier New", monospace; }
  .rcpt { display: block; font-size: 7.5px; color: var(--muted); font-weight: 400; line-height: 1.25; }
  table.ledger.receipts { margin-top: 10px; }
  table.ledger.receipts td.mono, table.ledger.receipts td.num { font-family: "Courier New", monospace; font-size: 9px; }
  col.r-date { width: 78px; } col.r-desc { width: auto; } col.r-months { width: 58px; }
  col.r-period { width: 132px; } col.r-amt { width: 92px; }
  table.ledger.receipts td.period { white-space: nowrap; font-size: 9px; }
  table.ledger.receipts thead th { background: #1f2937; }

  .paybox { margin-top: 18px; border: 1px solid var(--line); background: #f9fafb; padding: 8px 10px;
            font-size: 9px; color: #374151; display: flex; flex-direction: column; gap: 2px; }
  .paybox b { text-transform: uppercase; letter-spacing: .08em; font-size: 8px; color: #111; margin-bottom: 2px; }

  section.foot { position: absolute; left: 44px; right: 44px; bottom: 32px; }
  .notes { font-size: 8.5px; color: #374151; line-height: 1.45; border-top: 1px solid var(--line); padding-top: 8px; }
  .notes p { margin: 0 0 2px; }
  .sign { display: flex; gap: 60px; margin-top: 26px; }
  .sig { flex: 1; }
  .sig span { display: block; border-top: 1px solid var(--ink); margin-bottom: 4px; }
  .sig p { margin: 0; font-size: 9px; color: #374151; }

  .toolbar { position: fixed; top: 12px; right: 14px; display: flex; gap: 8px; z-index: 50; }
  .toolbar button, .toolbar a {
    font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 8px; border: 0;
    cursor: pointer; text-decoration: none; display: inline-block;
  }
  .btn-print { background: #059669; color: #fff; }
  .btn-back { background: #1e293b; color: #fff; }
  .state { max-width: 794px; margin: 80px auto; background: #fff; padding: 28px; border-radius: 10px;
           font-size: 14px; text-align: center; }

  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; }
    .page { width: auto; min-height: auto; margin: 0; padding: 0; box-shadow: none; }
    .toolbar, .state { display: none !important; }
    section.foot { position: static; margin-top: 22px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <a class="btn-back" href="javascript:history.length>1?history.back():window.close()">← Back</a>
  <button class="btn-print" onclick="window.print()">Print / Save PDF</button>
</div>

<div id="root"><div class="state">Loading statement…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
import { firebaseConfig } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const FEE = 80;

const money = v => (v < 0 ? "-" : "") + Math.abs(v).toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtBal = v => (v < 0 ? `(${money(Math.abs(v))})` : money(v));
const fmtPhone = p => {
  const d = String(p ?? "").replace(/\D/g, "");
  if (d.length === 11 && d.startsWith("01")) return `${d.slice(0,3)}-${d.slice(3,6)} ${d.slice(6)}`;
  if (d.length === 10 && d.startsWith("01")) return `${d.slice(0,3)}-${d.slice(3,6)} ${d.slice(6)}`;
  return p ? String(p) : "—";
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function parseParams() {
  const p = new URLSearchParams(location.search);
  return { road: p.get("road"), unit: p.get("unit"), id: p.get("id") };
}

async function loadResident({ road, unit, id }) {
  if (id) {
    const s = await getDoc(doc(db, "residents", id));
    return s.exists() ? { id: s.id, ...s.data() } : null;
  }
  if (!road || !unit) return null;
  /* residents is own-doc-only for a resident, so read by uid first and fall back to a
     query for committee accounts (this page was previously unreachable from the app). */
  let snap = null;
  const _u = getAuth(app).currentUser;
  if (_u) {
    const self = await getDoc(doc(db, "residents", _u.uid)).catch(() => null);
    if (self && self.exists()) snap = { docs: [self], empty: false };
  }
  if (!snap) {
    const q = query(collection(db, "residents"), where("road", "==", road), where("unitNumber", "==", unit));
    snap = await getDocs(q);
  }
  return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
}

async function loadInvoices(res) {
  const q = query(collection(db, "invoices"), where("road", "==", res.road), where("unitNumber", "==", res.unitNumber));
  const snap = await getDocs(q);
  const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  rows.sort((a, b) => (parseInt(a.year) - parseInt(b.year)) || (MONTHS.indexOf(a.month) - MONTHS.indexOf(b.month)));
  return rows;
}

/* Official receipts issued by MyJiran (org 161), keyed on the house's payRef.
   One receipt can cover several months, so the window (periodFrom..periodTo)
   is what ties a receipt to the month rows it paid. Read-only evidence: the
   statement prints what the issuer issued, never a synthesised number. */
/* Fallback source: the receipt window denormalised onto the resident doc.
   Used when the payments collection is not readable by this session — the
   statement must still print the receipt the committee can see, and must still
   print "coverage" (never an invented number) when there is none. */
function residentReceipts(res) {
  if (!res.receiptNoLatest) return [];
  return [{
    receiptNo: res.receiptNoLatest,
    receiptDate: res.receiptDateLatest,
    amount: res.receiptAmountLatest,
    months: res.receiptMonthsLatest,
    periodFrom: res.receiptPeriodFrom,
    periodTo: res.receiptPeriodTo
  }];
}

async function loadReceipts(res) {
  try {
    if (!res.payRef) return residentReceipts(res);
    const q = query(collection(db, "payments"), where("payRef", "==", res.payRef));
    const snap = await getDocs(q);
    const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(r => !r.voided && r.receiptNo);
    if (!rows.length) return residentReceipts(res);
    rows.sort((a, b) => String(a.receiptDate || "").localeCompare(String(b.receiptDate || "")));
    return rows;
  } catch (e) {
    console.warn("receipts collection unavailable, using resident record:", e && e.code ? e.code : e);
    return residentReceipts(res);
  }
}

const ym = (y, m) => `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}`;

function monthIndex(m) { return MONTHS.indexOf(m); }

function render(res, invoices, receipts = []) {
  // oldest receipt covering a given (year, month), or null
  const receiptFor = (y, m) => {
    const key = ym(y, m);
    return receipts.find(r => r.periodFrom && r.periodTo && r.periodFrom <= key && key <= r.periodTo) || null;
  };
  const rate = Number(res.soaRate || FEE);
  const billStart = res.soaBillStart || "2025-01";
  const openingAsOf = res.soaOpeningAsOf || "2026-10-31";
  const openCharged = Number(res.soaCharged || 0);
  const openPaid = Number(res.soaPaid || 0);
  const monthsBilled = Number(res.soaMonthsBilled || 0);
  // itemised ledger (bills backfilled from Jan 2025) => all figures come from invoices
  const hasOpening = !invoices.length && !!res.soaOpeningAsOf;
  const baseCharged = hasOpening ? openCharged : 0;
  const basePaid = hasOpening ? openPaid : 0;

  // ---- live transactions (after the cut-over) ----
  let balance = baseCharged - basePaid;
  const liveRows = invoices.map(inv => {
    const amt = parseFloat(inv.amount || 0);
    const paid = inv.status === "paid" ? amt : 0;
    balance += amt - paid;
    const paidAt = inv.paidAt?.toDate ? inv.paidAt.toDate() : null;
    const date = paidAt ? paidAt.toISOString().slice(0, 10)
                        : `${inv.year}-${String(monthIndex(inv.month) + 1).padStart(2, "0")}`;
    return { inv, amt, paid, date, balance };
  });

  const provisional = liveRows.filter(r => r.inv.status === "provisional");
  const provisionalTotal = provisional.reduce((s, r) => s + r.amt, 0);

  const liveCharged = liveRows.reduce((s, r) => s + r.amt, 0);
  const livePaid = liveRows.reduce((s, r) => s + r.paid, 0);
  // money received for months not yet billed (paid-ahead coverage past the last bill)
  const advance = Number(res.soaAdvance || 0);
  const totalCharged = baseCharged + liveCharged;
  const totalPaid = basePaid + livePaid + advance;
  const closing = totalCharged - totalPaid;

  const isCredit = closing < 0;
  const balanceLabel = isCredit ? "CREDIT BALANCE (ADVANCE)" : `BALANCE AS AT ${new Date().toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" }).toUpperCase()}`;

  let monthsNote = "";
  if (closing > 0) {
    const months = rate > 0 ? Math.round(closing / rate) : 0;
    monthsNote = `${months} month${months === 1 ? "" : "s"} outstanding`;
  } else if (closing < 0) {
    monthsNote = `Paid ahead${res.soaPaidThrough ? " to " + res.soaPaidThrough : ""} — credit held on account`;
  } else {
    monthsNote = "No outstanding — fully settled";
  }

  const ledgerHeader = hasOpening ? `Transactions after ${esc(openingAsOf)}` : "Monthly charges and payments";
  const liveBlock = liveRows.length ? `
      <tr class="section"><td colspan="5">${ledgerHeader}</td></tr>
      ${liveRows.map(r => `
        <tr>
          <td class="date">${esc(r.date)}</td>
          <td>${esc(r.inv.remarks || `Security fee — ${r.inv.month} ${r.inv.year}`)}</td>
          <td class="num">${money(r.amt)}</td>
          <td class="num pay">${r.paid ? money(r.paid) + (() => {
            const rc = receiptFor(parseInt(r.inv.year), monthIndex(r.inv.month) + 1);
            if (r.inv.receiptNumber) return `<span class="rcpt">${esc(r.inv.receiptNumber)}</span>`;
            if (rc) return `<span class="rcpt">${esc(rc.receiptNo)}<br>${esc(String(rc.receiptDate || "").slice(0, 10))}</span>`;
            return `<span class="rcpt">coverage</span>`;
          })() : ""}</td>
          <td class="num bal">${fmtBal(r.balance)}</td>
        </tr>`).join("")}` : `
      <tr class="section"><td colspan="5">${ledgerHeader}</td></tr>
      <tr><td class="date">—</td><td colspan="4" style="color:#6b7280;font-style:italic">No bills or payments recorded since the opening position.</td></tr>`;

  // A house with an itemised ledger (bills backfilled from Jan 2025) needs no
  // carried-forward opening block — the invoices are the statement.
  const openingDetail = hasOpening ? `
      <tr class="section"><td colspan="5">Opening position carried forward — ${esc(res.soaMonthsPaid || 0)} months paid${res.soaPaidThrough ? ", paid through " + esc(res.soaPaidThrough) : ""}</td></tr>
      <tr class="opening">
        <td class="date">${esc(billStart)}</td>
        <td>Security &amp; maintenance fees — ${monthsBilled} months @ RM${money(rate)} (${esc(billStart)} to ${esc(openingAsOf)})</td>
        <td class="num">${money(openCharged)}</td>
        <td class="num pay"></td>
        <td class="num bal">${fmtBal(openCharged)}</td>
      </tr>
      <tr class="opening">
        <td class="date">${esc(res.soaLatestReceiptDate || openingAsOf)}</td>
        <td>Payments received to ${esc(openingAsOf)} — ${esc(res.soaMonthsPaid || 0)} months${res.soaLatestReceiptDate ? `, last receipt ${esc(res.soaLatestReceiptDate)}` : ""}</td>
        <td class="num"></td>
        <td class="num pay">${money(openPaid)}${res.soaLatestReceipt ? `<span class="rcpt">${esc(res.soaLatestReceipt)}</span>` : ""}</td>
        <td class="num bal">${fmtBal(openCharged - openPaid)}</td>
      </tr>` : "";

  const now = new Date();
  const firstInv = liveRows.length ? liveRows[0].inv : null;
  const periodStart = hasOpening
    ? `${MONTHS[Number(billStart.slice(5, 7)) - 1].slice(0, 3)} ${billStart.slice(0, 4)}`
    : (firstInv ? `${String(firstInv.month).slice(0, 3)} ${firstInv.year}` : "—");
  const periodLabel = `${periodStart} – ${now.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })}`;
  const roadCode = String(res.road || "").replace("Jalan Suasana ", "").replace(/\//g, "");
  const statementNo = `SOA/${now.getFullYear()}/${roadCode}-${res.unitNumber}`;

  const html = `
  <div class="page">
    <header>
      <div class="brand">
        <h1>PERSATUAN PENDUDUK ZON C BTHO</h1>
        <p>Bandar Tun Hussein Onn, 43200 Cheras, Selangor</p>
        <p class="small">Registered under the Societies Act 1966 (ROS)</p>
      </div>
      <div class="doc">
        <h2>STATEMENT OF ACCOUNT</h2>
        <table class="meta">
          <tr><td>Statement No.</td><td class="mono">${statementNo}</td></tr>
          <tr><td>Statement Date</td><td class="mono">${new Date().toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" })}</td></tr>
          <tr><td>Period</td><td class="mono">${periodLabel}</td></tr>
        </table>
      </div>
    </header>

    <section class="house">
      <table class="kv">
        <tr><td class="k">House / Unit</td><td><b>No. ${esc(res.unitNumber)}, ${esc(res.road)}</b></td></tr>
        <tr><td class="k">Resident</td><td>${esc(res.name)}</td></tr>
        <tr><td class="k">Contact</td><td>${esc(fmtPhone(res.phone))}</td></tr>
        <tr><td class="k">Monthly Fee</td><td>RM ${money(rate)}</td></tr>
        <tr><td class="k">Payment Ref</td><td><b class="payref">${esc(res.payRef || "not assigned")}</b> <span class="k" style="display:inline;border:0;padding:0">— quote this on every transfer</span></td></tr>
        <tr><td class="k">Status</td><td>${res.isJoined ? "Registered on portal" : "Not registered on portal"}</td></tr>
      </table>
      <div class="summary">
        ${hasOpening ? `<div class="srow"><span>Opening balance (${esc(openingAsOf)})</span><b>${fmtBal(openCharged - openPaid)}</b></div>` : ""}
        <div class="srow"><span>Total charges</span><b>${money(totalCharged)}</b></div>
        <div class="srow"><span>Total payments received</span><b>${money(totalPaid)}</b></div>
        ${provisional.length ? `<div class="srow" style="color:#4338ca"><span>Recorded, awaiting committee verification${provisional.length > 1 ? ` (${provisional.length} months)` : ""}</span><b>${money(provisionalTotal)}</b></div>` : ""}
        ${advance > 0 ? `<div class="srow sub"><span>· of which advance for unbilled months</span><b>${money(advance)}</b></div>` : ""}
        <div class="srow total"><span>${balanceLabel}</span><b>RM ${fmtBal(closing)}</b></div>
        <div class="srow note"><span>${monthsNote}</span><b></b></div>
      </div>
    </section>

    <table class="ledger">
      <colgroup><col class="c-date"><col class="c-desc"><col class="c-amt"><col class="c-amt"><col class="c-amt"></colgroup>
      <thead>
        <tr>
          <th class="date">Date</th>
          <th>Description</th>
          <th class="num">Charges<br><span>(RM)</span></th>
          <th class="num">Payments<br><span>(RM)</span></th>
          <th class="num">Balance<br><span>(RM)</span></th>
        </tr>
      </thead>
      <tbody>
        ${openingDetail}
        ${liveBlock}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">${balanceLabel}</td>
          <td class="num">${money(totalCharged)}</td>
          <td class="num">${money(totalPaid)}</td>
          <td class="num bal">${fmtBal(closing)}</td>
        </tr>
      </tfoot>
    </table>

    ${receipts.length ? `
    <table class="ledger receipts">
      <colgroup><col class="r-date"><col class="r-desc"><col class="r-months"><col class="r-period"><col class="r-amt"></colgroup>
      <thead>
        <tr>
          <th class="date">Receipt date</th>
          <th>Official receipt no. (MyJiran)</th>
          <th class="num">Months</th>
          <th class="num">Period covered</th>
          <th class="num">Amount<br><span>(RM)</span></th>
        </tr>
      </thead>
      <tbody>
        ${receipts.map(rc => `
        <tr>
          <td class="date">${esc(String(rc.receiptDate || "").slice(0, 10) || "—")}</td>
          <td class="mono">${esc(rc.receiptNo)}</td>
          <td class="num">${esc(rc.months ?? "—")}</td>
          <td class="num period">${esc(rc.periodFrom || "—")} to ${esc(rc.periodTo || "—")}</td>
          <td class="num pay">${money(Number(rc.amount || 0))}</td>
        </tr>`).join("")}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4">Receipts on record</td>
          <td class="num">${money(receipts.reduce((s, r) => s + Number(r.amount || 0), 0))}</td>
        </tr>
      </tfoot>
    </table>` : ""}

    <div class="paybox">
      <b>How to pay</b>
      <span>Cash — to the appointed collector, official receipt issued on the spot.</span>
      <span>Bank transfer — association account (details on request). Quote your house number and road.</span>
      <span>Enquiry — Honorary Secretary, Persatuan Penduduk Zon C BTHO.</span>
    </div>

    <section class="foot">
      <div class="notes">
        <p><b>Notes</b></p>
        <p>1. Charges are the monthly security &amp; maintenance fee of RM ${money(rate)} per house, raised on the 1st of each month from ${esc(periodStart)}.</p>
        ${receipts.length
          ? `<p>2. Receipt numbers and dates are as issued by the association's collection system (MyJiran, organisation 161) and are reproduced verbatim. One receipt may settle several consecutive months; the period it covers is shown against each receipt, and the receipt number appears under every month it paid.</p>`
          : (invoices.length
              ? `<p>2. Months shown as paid are reconstructed from the association's months-paid coverage record. No official receipt has been traced for this house, so no receipt number is printed.</p>`
              : `<p>2. The opening position (${esc(openingAsOf)}) is carried forward from the association's records. Detail is summarised by month count, not by individual receipt.</p>`)}
        <p>3. Where a paid month shows "coverage" instead of a receipt number, that month is supported by the collection record only — the receipt has not been traced and is not claimed.</p>
        <p>4. Any discrepancy must be reported to the Honorary Secretary within 14 days of the statement date.</p>
        <p>5. This statement is computer-generated on ${new Date().toLocaleString("en-GB")}.</p>
      </div>
      <div class="sign">
        <div class="sig"><span></span><p>Honorary Treasurer</p></div>
        <div class="sig"><span></span><p>Honorary Auditor</p></div>
      </div>
    </section>
  </div>`;

  document.getElementById("root").innerHTML = html;
  document.title = `SOA — ${res.road} No ${res.unitNumber}`;
}

/* Statements stay committee-only for now: they are handed to residents by the admin
   after review, never pulled by residents from their own app. */
const auth = getAuth();
const gate = () => new Promise(resolve => {
  const stop = onAuthStateChanged(auth, user => { stop(); resolve(user); });
});

(async () => {
  try {
    const user = await gate();
    if (!user) {
      document.getElementById("root").innerHTML =
        `<div class="state">Restricted<br><small>Statements of Account are available to the committee only.<br>Sign in to the admin portal, then open the statement from a resident record.</small></div>`;
      return;
    }

    const params = parseParams();
    const res = await loadResident(params);
    if (!res) {
      document.getElementById("root").innerHTML =
        `<div class="state">No resident found for this house.<br><small>Open this page from a resident record.</small></div>`;
      return;
    }
    const [invoices, receipts] = await Promise.all([loadInvoices(res), loadReceipts(res)]);
    render(res, invoices, receipts);
  } catch (e) {
    document.getElementById("root").innerHTML =
      `<div class="state">Could not build the statement.<br><small>${esc(e.message)}</small></div>`;
  }
})();
</script>
</body>
</html>
